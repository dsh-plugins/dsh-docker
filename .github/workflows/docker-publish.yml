name: Build and publish Docker image

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Publish the pinned version even when no higher version exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dsh-docker-publish
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.version.outputs.build }}
      newer: ${{ steps.version.outputs.newer }}
      image: ${{ steps.version.outputs.image }}
      pin: ${{ steps.version.outputs.pin }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/scripts/dsh-version.test.mjs
      - name: Compare the pinned DSH version to the three npm tags
        id: version
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: node .github/scripts/dsh-version.mjs resolve

  publish:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.tag }},priority=1000
            type=raw,value=latest
            type=raw,value=next
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: |
            dsh-docker:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DSH_VERSION=${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=dsh-docker-amd64
          cache-to: type=gha,scope=dsh-docker-amd64,mode=max

      - name: Check the exact version and plugin-free profile on a new data volume
        shell: bash
        env:
          EXPECTED_DSH_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          smoke="dsh-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$smoke" >/dev/null 2>&1 || true; docker volume rm "$smoke" >/dev/null 2>&1 || true' EXIT
          docker run --detach --init --name "$smoke" \
            --env EXPECTED_DSH_VERSION \
            --mount "type=volume,source=${smoke},target=/data" \
            dsh-docker:smoke >/dev/null
          ready=false
          for ((attempt = 0; attempt < 45; attempt++)); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$smoke")" != true ]]; then
              echo "Default Web server exited: $(docker inspect --format '{{.State.ExitCode}}' "$smoke")" >&2
              exit 1
            fi
            host="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$smoke")"
            if [[ -n "$host" ]] && docker exec "$smoke" curl -fsS --max-time 2 "http://$host:3080/" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || { echo 'Default Web server did not respond on port 3080' >&2; exit 1; }
          echo 'Default Web server responded on port 3080'
          docker exec -i "$smoke" bash -s <<'SH'
          set -euo pipefail
          node -e 'const assert = require("node:assert/strict"); assert.equal(require(process.argv[1]).version, process.env.EXPECTED_DSH_VERSION)' "$(npm root -g)/@deepseek-ai/dsh/package.json"
          profile="$DSH_HOME/profiles/web"
          test -f "$profile/pnpm-workspace.yaml"
          test ! -e "$profile/node_modules"
          node -e 'const fs = require("node:fs"); const p = process.argv[1]; if (fs.existsSync(p)) require("node:assert/strict").deepEqual(JSON.parse(fs.readFileSync(p)).dependencies ?? {}, {})' "$profile/package.json"
          # Run the same entrypoint on an isolated fixture for an existing data volume.
          export DSH_HOME=/data/legacy-check
          profile="$DSH_HOME/profiles/web"
          mkdir -p "$profile"
          printf '{"dependencies":{"example-existing-plugin":"1.0.0"}}\n' > "$profile/package.json"
          printf '# user setting\n' > "$profile/pnpm-workspace.yaml"
          cp "$profile/package.json" /tmp/profile-before.json
          cp "$profile/pnpm-workspace.yaml" /tmp/workspace-before.yaml
          /usr/local/bin/docker-entrypoint.sh dsh --version >/dev/null
          cmp /tmp/profile-before.json "$profile/package.json"
          cmp /tmp/workspace-before.yaml "$profile/pnpm-workspace.yaml"
          echo 'Exact DSH version, clean profile, and existing profile preservation verified'
          SH

      - name: Push checked image to GHCR
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"

  bump-dockerfile:
    needs: [resolve, publish]
    if: needs.resolve.outputs.newer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record the published version
        shell: bash
        env:
          EXPECTED_PIN: ${{ needs.resolve.outputs.pin }}
          DSH_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/dsh-version.mjs bump "$EXPECTED_PIN" "$DSH_VERSION"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: bump DSH to $DSH_VERSION [skip ci]" -- Dockerfile
          git push origin "HEAD:${GITHUB_REF}"
