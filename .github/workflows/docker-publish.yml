name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve image name and npm next versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const packages = [
            ['dsh', '@deepseek-ai/dsh'],
            ['loader', '@dsh-plugin/dsh-loader'],
            ['auxiliary', '@dsh-plugin/dsh-auxiliary'],
            ['synapse', '@dsh-plugin/dsh-synapse'],
          ];
          const versions = await Promise.all(packages.map(async ([key, name]) => {
            const response = await fetch(`https://registry.npmjs.org/${name}/next`, {
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) throw new Error(`${name}@next: HTTP ${response.status}`);
            const metadata = await response.json();
            const { version } = metadata;
            if (metadata.name !== name || typeof version !== 'string'
              || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid npm next metadata for ${name}`);
            }
            console.log(`${name}@next -> ${version}`);
            return { key, name, version };
          }));

          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\n`
            + versions.map(({ key, version }) => `${key}=${version}\n`).join(''));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### npm next versions\n\nImage: ${image}\n\n| Package | Version |\n| --- | --- |\n`
            + versions.map(({ name, version }) => `| ${name} | ${version} |\n`).join(''));
          NODE

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.versions.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=next,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag,prefix=tag-
            type=sha
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.versions.outputs.dsh }}
            DSH_LOADER_VERSION=${{ steps.versions.outputs.loader }}
            DSH_AUXILIARY_VERSION=${{ steps.versions.outputs.auxiliary }}
            DSH_SYNAPSE_VERSION=${{ steps.versions.outputs.synapse }}
          cache-from: type=gha,scope=dsh-docker-amd64
          cache-to: type=gha,scope=dsh-docker-amd64,mode=max
