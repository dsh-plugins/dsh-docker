name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve image name and npm versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const packages = [
            ['dsh', '@deepseek-ai/dsh', 'alpha'],
            ['loader', '@dsh-plugin/dsh-loader', 'next'],
            ['auxiliary', '@dsh-plugin/dsh-auxiliary', 'next'],
            ['synapse', '@dsh-plugin/dsh-synapse', 'next'],
          ];
          const versions = await Promise.all(packages.map(async ([key, name, tag]) => {
            const response = await fetch(`https://registry.npmjs.org/${name}/${tag}`, {
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) throw new Error(`${name}@${tag}: HTTP ${response.status}`);
            const metadata = await response.json();
            const { version } = metadata;
            if (metadata.name !== name || typeof version !== 'string'
              || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid npm metadata for ${name}@${tag}`);
            }
            console.log(`${name}@${tag} -> ${version}`);
            return { key, name, tag, version };
          }));

          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\n`
            + versions.map(({ key, version }) => `${key}=${version}\n`).join(''));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### npm versions\n\nImage: ${image}\n\n| Package | Tag | Version |\n| --- | --- | --- |\n`
            + versions.map(({ name, tag, version }) => `| ${name} | ${tag} | ${version} |\n`).join(''));
          NODE

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.versions.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=next,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag,prefix=tag-
            type=sha
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: |
            dsh-docker:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.versions.outputs.dsh }}
            DSH_LOADER_VERSION=${{ steps.versions.outputs.loader }}
            DSH_AUXILIARY_VERSION=${{ steps.versions.outputs.auxiliary }}
            DSH_SYNAPSE_VERSION=${{ steps.versions.outputs.synapse }}
          cache-from: type=gha,scope=dsh-docker-amd64
          cache-to: type=gha,scope=dsh-docker-amd64,mode=max

      - name: Check plugin installation and removal on a data volume
        shell: bash
        env:
          EXPECTED_DSH_VERSION: ${{ steps.versions.outputs.dsh }}
        run: |
          set -euo pipefail
          smoke_volume="dsh-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --init -i \
            --env EXPECTED_DSH_VERSION \
            --mount "type=volume,source=${smoke_volume},target=/data" \
            dsh-docker:smoke bash -s <<'SH'
          set -euo pipefail
          zod_version="$(node -p 'require("/opt/dsh-home/profiles/web/node_modules/zod/package.json").version')"
          /usr/local/bin/docker-entrypoint.sh dsh plugin --profile web add --save-exact "zod@${zod_version}"
          cd "$DSH_HOME/profiles/web"
          node --input-type=module -e 'await import("zod/v3"); await import("zod/v4-mini"); await import("@modelcontextprotocol/sdk/server/mcp.js");'
          export DSH_INSTALL_ROOT="$(npm root -g)/@deepseek-ai/dsh"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const installAnchor = join(process.env.DSH_INSTALL_ROOT, 'package.json');
          const require = createRequire(installAnchor);
          assert.equal(require(installAnchor).version, process.env.EXPECTED_DSH_VERSION);
          const { runProfilePnpm } = await import(pathToFileURL(
            require.resolve('@deepseek-ai/dsh-plugin-manager/operations')));
          const dir = join(process.env.DSH_HOME, 'profiles/web');
          const name = '@dsh-plugin/dsh-auxiliary';
          const result = await runProfilePnpm({ profile: 'web', dir, cwd: dir, installAnchor },
            ['remove', name], {
              execution: 'service', outputBytes: 1024 * 1024, activateNewBundles: false,
              onOutput: text => process.stdout.write(text),
            });
          assert.equal(result.exitCode, 0, result.output);
          assert.equal(JSON.parse(readFileSync(join(dir, 'package.json'), 'utf8')).dependencies?.[name], undefined);
          console.log('Web plugin-manager removal passed');
          NODE
          SH

      - name: Push checked image to GHCR
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Remove smoke-test volume
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          smoke_volume="dsh-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker volume inspect "$smoke_volume" > /dev/null 2>&1; then
            docker volume rm "$smoke_volume"
          fi
